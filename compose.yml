services:
  ros2-jazzy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros2-jazzy
    hostname: ros2-jazzy
    ports:
      - "9090:9090"   # rosbridge websocket
      - "8080:8080"   # web client
    environment:
      ROBOT_HOST: ${ROBOT_HOST}
      ROBOT_TOKEN: ${ROBOT_TOKEN}
    volumes:
      - ./ros2_ws:/root/ros2_ws
      - ./web:/root/web:ro
      - ./alias.sh:/root/alias.sh # avoid rebuilding the image when the alias.sh file changes (can remove when alias is complete)
    tty: true
